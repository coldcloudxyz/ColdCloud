<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ColdCloud — App</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f5f4;--white:#fff;--border:#e2dfd9;--text:#18181b;--text2:#52525b;--blue:#1d4ed8}
html,body{min-height:100%;font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{-webkit-font-smoothing:antialiased}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(100%,760px);background:var(--white);border:1px solid var(--border);border-radius:16px;padding:48px;box-shadow:0 12px 30px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:36px;font-size:18px;font-weight:600}
.logo img{width:36px;height:36px;border-radius:9px}
h1{font-size:32px;letter-spacing:-.04em;margin-bottom:10px}
p{font-size:15px;line-height:1.6;color:var(--text2)}
.badge{display:inline-flex;margin-top:24px;padding:7px 10px;border-radius:999px;background:#eff6ff;color:var(--blue);font-size:12px;font-weight:600}
</style>
</head>
<body>
<main class="app">
  <section class="card">
    <div class="logo">
      <img src="./assets/coldcloud-logo.png" alt="ColdCloud">
      <span>ColdCloud</span>
    </div>
    <h1>Your workspace starts here.</h1>
    <p>The application foundation is ready. We are building the ColdCloud workspace from a clean slate.</p>
    <span class="badge">Workspace</span>
  </section>
</main>
</body>
</html>
